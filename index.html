<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Breakup.exe</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <main class="login-page">


        <div class="login-card">


            <div class="tiny-label">
                SYSTEM ERROR 404: EMOTIONAL STABILITY NOT FOUND
            </div>


            <div class="glitch-title">
                BREAKUP.EXE
            </div>


            <h2>
                HAS STOPPED WORKING 💀
            </h2>


            <p class="login-subtitle">
                Welcome to the Emergency Recovery Program.
            </p>


            <div class="floating-emojis">
                💔 ✦ ☕ ✦ 🍜 ✦ 🚶
            </div>


            <div class="input-box">

                <label for="name">
                    First things first...
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    autocomplete="off"
                >

            </div>


            <div class="input-box">

                <label for="secret">
                    Enter the secret code 👀
                </label>

                <input
                    type="password"
                    id="secret"
                    placeholder="You know the code..."
                >

            </div>


            <button
                id="enterBtn"
                class="main-button"
            >
                ENTER THE CHAOS →
            </button>


            <p
                id="errorMessage"
                class="error-message"
            ></p>


            <p class="side-effect">

                Side effects may include eating properly,
                touching grass, laughing randomly and
                developing character.

            </p>


        </div>


    </main>


    <script src="login.js"></script>


</body>

</html>
